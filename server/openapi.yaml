openapi: 3.1.0
info:
  title: Cocktails Server API
  description: A simple API for serving cocktail recipes
  version: 1.0.0
  contact:
    name: Cocktails Server Support
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://127.0.0.1:8080
    description: Alternative local server
tags:
  - name: Health
    description: Health check endpoints
  - name: Cocktails
    description: Cocktail recipe endpoints
paths:
  /:
    get:
      summary: Welcome message
      description: Returns a welcome message
      operationId: getWelcome
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: "Welcome to Cocktails Server! 🍹"
  /health:
    get:
      summary: Health check
      description: Check if the server is running
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
  /api/v1/cocktails:
    get:
      summary: List all cocktails
      description: Returns a list of all available cocktail recipes
      operationId: getAllCocktails
      tags:
        - Cocktails
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cocktail'
  /api/v1/cocktails/{id}:
    get:
      summary: Get cocktail by ID
      description: Returns a specific cocktail recipe by its ID
      operationId: getCocktailById
      tags:
        - Cocktails
      parameters:
        - name: id
          in: path
          required: true
          description: The cocktail ID
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
        '404':
          description: Cocktail not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Not Found"
  /api/v1/cocktails/type/{type}:
    get:
      summary: Get cocktails by type
      description: Returns all cocktails of a specific type
      operationId: getCocktailsByType
      tags:
        - Cocktails
      parameters:
        - name: type
          in: path
          required: true
          description: The cocktail type
          schema:
            type: string
            enum:
              - alcoholic
              - non-alcoholic
            example: "non-alcoholic"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cocktail'
        '400':
          description: Invalid type parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
components:
  schemas:
    Cocktail:
      type: object
      required:
        - id
        - name
        - type
        - shortDescription
        - longDescription
        - preparationMinutes
        - imageName
        - ingredients
      properties:
        id:
          type: string
          description: Unique identifier for the cocktail
          example: "1"
        name:
          type: string
          description: Name of the cocktail
          example: "Mojito"
        type:
          type: string
          description: Type of cocktail
          enum:
            - alcoholic
            - non-alcoholic
          example: "alcoholic"
        shortDescription:
          type: string
          description: Brief description of the cocktail
          example: "A refreshing Cuban classic made with white rum and muddled fresh mint."
        longDescription:
          type: string
          description: Detailed description of the cocktail
          example: "This is an authentic recipe for mojito. I sized the recipe for one serving, but you can adjust it accordingly and make a pitcher full."
        preparationMinutes:
          type: integer
          description: Time required to prepare the cocktail in minutes
          minimum: 1
          example: 10
        imageName:
          type: string
          description: Name of the cocktail image file (without extension)
          example: "mojito"
        ingredients:
          type: array
          description: List of ingredients required for the cocktail
          items:
            $ref: '#/components/schemas/Ingredient'
    Ingredient:
      type: object
      required:
        - imperialAmount
        - name
        - metricAmount
      properties:
        imperialAmount:
          type: string
          description: Amount of ingredient in imperial units or count
          example: "1 ½ fluid ounces"
        name:
          type: string
          description: Name of the ingredient
          example: "white rum"
        metricAmount:
          type: string
          description: Amount of ingredient in metric units
          example: "45 ml"